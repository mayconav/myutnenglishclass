  <section class="view" id="view-progreso" data-view="progreso" hidden>
    <div class="section-head">
      <p class="eyebrow">Learning Passport</p>
      <h2>Your Progress</h2>
      <p class="lead">Check the stamps you've earned and the program's pending deliverables.</p>
    </div>

    <div class="progress-summary">
      <div class="summary-card">
        <span class="summary-num" id="summary-level">A1</span>
        <span class="summary-label">Current Level</span>
      </div>
      <div class="summary-card">
        <span class="summary-num" id="summary-stamps">0</span>
        <span class="summary-label">Stamps Earned</span>
      </div>
      <div class="summary-card">
        <span class="summary-num" id="summary-percent">0%</span>
        <span class="summary-label">Program Completed</span>
      </div>
    </div>

    <div class="passport" id="passport-stamps"><!-- generated by JS --></div>

    <div class="certificate-card" id="certificate-card">
      <div class="certificate-info">
        <p class="quiz-heading">Program Certificate</p>
        <p class="certificate-desc" id="certificate-desc">Complete all six levels (A1 to C2) to unlock your downloadable certificate.</p>
      </div>
      <button class="btn btn-primary" id="certificate-btn" disabled>Download Certificate</button>
    </div>

    <div class="deliverables">
      <p class="quiz-heading">Social Service Deliverables</p>
      <ul class="deliverables-list" id="deliverables-list"><!-- generated by JS --></ul>
    </div>
  </section>
