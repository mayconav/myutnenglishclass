name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK firmado
        working-directory: android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copiar APK a /download
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/MyUTNEnglishClass.apk
          ls -lh download

      - name: Guardar APK en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f download/MyUTNEnglishClass.apk
          git commit -m "chore: nuevo APK (build ${{ github.run_number }}) [skip ci]" || echo "Sin cambios"
          git push

      - name: Subir APK como artefacto (respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: MyUTNEnglishClass-apk
          path: download/MyUTNEnglishClass.apk
