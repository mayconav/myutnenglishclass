name: Tests

# Corre las pruebas de la app (carpeta tests/) en cada push a main y en cada pull request.
# No necesita emulador ni internet: la app se carga en jsdom con Firestore y Capacitor falsos.
# Las pruebas de reglas de Firestore usan el emulador y se corren en tu PC (ver TESTING.md).

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "download/**"

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm test
